# Wear companion dependencies, kept apart from Molly's catalogs so upstream rebases don't conflict.
# Used only by :wear-bridge and :wear. Keep the Google Play services dependency out of :app.

[versions]
play-services-wearable = "20.0.1"
wear-compose = "1.6.2"  # newest that supports compileSdk 36.1 (1.7.x needs 37)
wear-input = "1.2.0"
wear-minSdk = "30"  # Wear OS 3
# Instrumentation tests on real watches: Espresso 3.5 (pulled in by Compose ui-test) calls
# InputManager.getInstance by reflection, which Android 17 (Pixel Watch 3) removed.
wear-androidx-test = "1.7.0"
wear-androidx-test-ext-junit = "1.3.0"
wear-espresso = "3.7.0"

[libraries]
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wear-compose" }
wear-compose-ui-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wear-compose" }
wear-input = { module = "androidx.wear:wear-input", version.ref = "wear-input" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "wear-androidx-test" }
androidx-test-core = { module = "androidx.test:core", version.ref = "wear-androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "wear-androidx-test-ext-junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "wear-espresso" }

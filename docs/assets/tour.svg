<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Three Molly4Watch screens: chat list, a conversation, message actions">
  <!-- Original illustration with made-up chats. AGPL-3.0. -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4E6"/>
      <stop offset="0.5" stop-color="#F3ECFF"/>
      <stop offset="1" stop-color="#E6F7FF"/>
    </linearGradient>
    <clipPath id="c1"><circle cx="0" cy="0" r="128"/></clipPath>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg2)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <!-- 1: chat list -->
    <g transform="translate(200 200)">
      <circle r="150" fill="#3A3550"/><circle r="138" fill="#0B0A10"/>
      <g clip-path="url(#c1)">
        <text y="-96" text-anchor="middle" font-size="15" fill="#C9C3E6">10:09</text>
        <text y="-70" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Chats</text>
        <rect x="-118" y="-54" width="236" height="62" rx="31" fill="#2D3133"/>
        <circle cx="-86" cy="-23" r="20" fill="#FF8A65"/><text x="-86" y="-17" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">A</text>
        <circle cx="-72" cy="-38" r="8" fill="#F2B8B5"/><text x="-72" y="-34" text-anchor="middle" font-size="10" font-weight="700" fill="#601410">2</text>
        <text x="-58" y="-28" font-size="15" font-weight="700" fill="#fff">Alex</text><text x="70" y="-28" font-size="11" font-weight="700" fill="#A3CCE4">2 min</text>
        <text x="-58" y="-9" font-size="13" font-weight="700" fill="#EDEAF7">Coffee? ☕</text>
        <rect x="-118" y="14" width="236" height="62" rx="31" fill="#2D3133"/>
        <circle cx="-86" cy="45" r="20" fill="#4DB6AC"/><text x="-86" y="51" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">B</text>
        <text x="-58" y="40" font-size="15" fill="#fff">Book club 📚</text><text x="78" y="40" font-size="11" fill="#B0AAC6">1 h</text>
        <text x="-58" y="59" font-size="13" fill="#B0AAC6">You: Chapter 4!</text>
      </g>
    </g>
    <text x="200" y="400" text-anchor="middle" font-size="20" font-weight="800" fill="#3B2A73">📋 Your chats</text>

    <!-- 2: conversation -->
    <g transform="translate(600 200)">
      <circle r="150" fill="#3A3550"/><circle r="138" fill="#0B0A10"/>
      <g clip-path="url(#c1)">
        <text y="-96" text-anchor="middle" font-size="15" fill="#C9C3E6">Alex</text>
        <rect x="-108" y="-80" width="120" height="34" rx="16" fill="#2E2A40"/>
        <text x="-96" y="-57" font-size="14" fill="#EDEAF7">Coffee? ☕</text>
        <rect x="-18" y="-36" width="124" height="84" rx="16" fill="#7C5CFF"/>
        <rect x="-8" y="-28" width="104" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.16"/>
        <rect x="-8" y="-28" width="3" height="38" fill="#FFFFFF" fill-opacity="0.8"/>
        <text x="2" y="-13" font-size="11" font-weight="700" fill="#fff">Alex</text>
        <text x="2" y="3" font-size="11" fill="#EDE7FF">Coffee? ☕</text>
        <text x="-6" y="34" font-size="14" fill="#fff">Omw! 🏃</text>
        <rect x="70" y="42" width="30" height="20" rx="10" fill="#1B1730" stroke="#7C5CFF" stroke-width="1.5"/>
        <text x="77" y="57" font-size="12">❤️</text>
        <text x="58" y="80" font-size="11" fill="#B0AAC6">10:09</text>
        <rect x="-70" y="92" width="140" height="30" rx="15" fill="#A3CCE4"/>
        <text y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A3A">Reply</text>
      </g>
    </g>
    <text x="600" y="400" text-anchor="middle" font-size="20" font-weight="800" fill="#3B2A73">👈 Swipe to quote-reply</text>

    <!-- 3: actions -->
    <g transform="translate(1000 200)">
      <circle r="150" fill="#3A3550"/><circle r="138" fill="#0B0A10"/>
      <g clip-path="url(#c1)">
        <text y="-88" text-anchor="middle" font-size="13" fill="#B0AAC6">Coffee? ☕</text>
        <g font-size="22">
          <circle cx="-62" cy="-50" r="22" fill="#3B2F63"/><text x="-74" y="-42">❤️</text>
          <circle cx="0" cy="-50" r="22" fill="#2D3133"/><text x="-12" y="-42">👍</text>
          <circle cx="62" cy="-50" r="22" fill="#2D3133"/><text x="50" y="-42">👎</text>
          <circle cx="-62" cy="4" r="22" fill="#2D3133"/><text x="-74" y="12">😂</text>
          <circle cx="0" cy="4" r="22" fill="#2D3133"/><text x="-12" y="12">😮</text>
          <circle cx="62" cy="4" r="22" fill="#2D3133"/><text x="50" y="12">😢</text>
        </g>
        <rect x="-90" y="40" width="180" height="34" rx="17" fill="#A3CCE4"/>
        <text y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#0F2A3A">Reply</text>
        <rect x="-90" y="82" width="180" height="34" rx="17" fill="#A3CCE4"/>
        <text y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F2A3A">Remove my reaction</text>
      </g>
    </g>
    <text x="1000" y="400" text-anchor="middle" font-size="20" font-weight="800" fill="#3B2A73">✋ Long-press for actions</text>
  </g>
</svg>
